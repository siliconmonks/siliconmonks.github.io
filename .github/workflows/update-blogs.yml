name: Update Silicon Monks Blogs

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blogs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch published DEV.to articles
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          mkdir -p data

          curl --fail --silent --show-error \
            -H "api-key: ${DEVTO_API_KEY}" \
            -H "Accept: application/vnd.forem.api-v1+json" \
            "https://dev.to/api/articles/me/published?per_page=1000" \
            -o data/blogs.json

      - name: Verify blog data
        run: |
          echo "Number of published articles:"
          jq length data/blogs.json

          echo "Articles:"
          jq -r '.[].title' data/blogs.json

      - name: Commit updated blog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/blogs.json

          if git diff --cached --quiet; then
            echo "No blog changes detected."
          else
            git commit -m "Update Silicon Monks blog data"
            git push
          fi
